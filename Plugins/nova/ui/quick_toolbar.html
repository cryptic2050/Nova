<!doctype html><meta charset="utf-8"><title>QuickToolBar</title>
<style>
  body{margin:0;background:#f4f4f4;font:12px sans-serif;overflow:hidden}
  #ring{position:relative;width:420px;height:420px}
  .btn{position:absolute;width:46px;height:46px;margin:-23px;border-radius:50%;border:2px solid #c9ced8;
       background:#fff;color:#3b5fc0;font-weight:700;cursor:pointer;box-shadow:0 1px 3px #0003;font-size:11px}
  .btn:hover{background:#e6edff;border-color:#3b5fc0}
  #c{position:absolute;left:210px;top:210px;color:#d22;font-size:14px;transform:translate(-50%,-50%);pointer-events:none}
</style>
<div id="ring"><div id="c">QuickToolBar</div></div>
<script>
const tools=[['cabinets','Cabinets'],['grain','Grain'],['door','Doors'],['labels','Labels'],
 ['preflight','Check'],['nesting','Nesting'],['settings','Setup']];
const ring=document.getElementById('ring');
tools.forEach(([id,label],k)=>{const a=2*Math.PI*k/tools.length-Math.PI/2,b=document.createElement('button');
  b.className='btn';b.textContent=label;b.title=label;
  b.style.left=(210+110*Math.cos(a))+'px';b.style.top=(210+110*Math.sin(a))+'px';
  b.onclick=()=>window.sketchup.run(id);ring.appendChild(b)});
</script>
